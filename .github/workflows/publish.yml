name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

# Least-privilege permissions: `id-token: write` is required for npm SLSA provenance attestation.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build, Verify & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit production & build dependencies
        run: npm audit --audit-level=high

      - name: Build, typecheck, and run tests
        run: npm test

      - name: Verify release tag matches package.json version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          NORMALIZED_TAG="${RELEASE_TAG#v}"
          if [ "$PKG_VERSION" != "$NORMALIZED_TAG" ]; then
            echo "Error: Release tag ($RELEASE_TAG) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Verify package tarball contents
        run: npm run pack:check

      # Requires NODE_AUTH_TOKEN secret (or npm Trusted Publishing configured on npmjs.com).
      # --provenance generates cryptographic SLSA build provenance linked to this workflow run.
      - name: Publish package with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
